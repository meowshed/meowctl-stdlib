name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Check / Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - name: Check formatting
        run: mise run lint

  # meowctl is a Rust workspace with no Linux release to download, so one job
  # builds a static musl binary that every Linux job, container or not, runs.
  build-linux:
    name: Build meowctl (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout meowctl
        uses: actions/checkout@v6
        with:
          repository: meowshed/meowctl
          path: meowctl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: meowctl

      - name: Build meowctl
        working-directory: meowctl
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - uses: actions/upload-artifact@v7
        with:
          name: meowctl-linux
          path: meowctl/target/x86_64-unknown-linux-musl/release/meowctl
          if-no-files-found: error

  component-check:
    name: Check / Components
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Checkout meowctl-stdlib
        uses: actions/checkout@v6
        with:
          path: stdlib

      - uses: actions/download-artifact@v8
        with:
          name: meowctl-linux
          path: bin

      - name: Check all components
        run: |
          chmod +x bin/meowctl
          bin/meowctl check stdlib/components
          bin/meowctl check stdlib/bundles

  # meowctl's own corpus test evaluates every component in a meowctl-stdlib
  # checked out beside it, and skips when there is none, so the directory
  # names matter.
  corpus:
    name: Check / Corpus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout meowctl-stdlib
        uses: actions/checkout@v6
        with:
          path: meowctl-stdlib

      - name: Checkout meowctl
        uses: actions/checkout@v6
        with:
          repository: meowshed/meowctl
          path: meowctl

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: meowctl

      - name: Evaluate the corpus
        working-directory: meowctl
        run: cargo test --locked -p meowctl-starlark --test stdlib -- --nocapture

  integration-ubuntu:
    name: Integration / Ubuntu
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Checkout meowctl-stdlib
        uses: actions/checkout@v6
        with:
          path: stdlib

      - uses: actions/download-artifact@v8
        with:
          name: meowctl-linux
          path: bin

      - name: Install meowctl
        run: |
          mkdir -p "$HOME/.local/bin"
          install -m755 bin/meowctl "$HOME/.local/bin/meowctl"
          echo "MEOWCTL_BIN=$HOME/.local/bin/meowctl" >> "$GITHUB_ENV"

      - name: Smoke test (apt)
        env:
          STDLIB_PATH: ${{ github.workspace }}/stdlib
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash stdlib/scripts/pm-smoke-test.sh \
            test-apt test-mise test-npm test-python test-gem test-cargo test-go test-luarocks test-github test-fish test-flatpak

  integration-fedora:
    name: Integration / Fedora
    runs-on: ubuntu-latest
    needs: build-linux
    container: fedora:latest
    env:
      HOME: /root
    steps:
      - name: Install git
        run: dnf install -y git sudo

      - name: Checkout meowctl-stdlib
        uses: actions/checkout@v6
        with:
          path: stdlib

      - uses: actions/download-artifact@v8
        with:
          name: meowctl-linux
          path: bin

      - name: Install meowctl
        run: |
          mkdir -p "$HOME/.local/bin"
          install -m755 bin/meowctl "$HOME/.local/bin/meowctl"
          echo "MEOWCTL_BIN=$HOME/.local/bin/meowctl" >> "$GITHUB_ENV"

      - name: Smoke test (dnf)
        env:
          STDLIB_PATH: ${{ github.workspace }}/stdlib
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash stdlib/scripts/pm-smoke-test.sh \
            test-dnf test-mise test-npm test-python test-gem test-cargo test-go test-luarocks test-github

  integration-arch:
    name: Integration / Arch
    runs-on: ubuntu-latest
    needs: build-linux
    container: archlinux:latest
    env:
      HOME: /root
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm git sudo

      - name: Checkout meowctl-stdlib
        uses: actions/checkout@v6
        with:
          path: stdlib

      - uses: actions/download-artifact@v8
        with:
          name: meowctl-linux
          path: bin

      - name: Install meowctl
        run: |
          mkdir -p "$HOME/.local/bin"
          install -m755 bin/meowctl "$HOME/.local/bin/meowctl"
          echo "MEOWCTL_BIN=$HOME/.local/bin/meowctl" >> "$GITHUB_ENV"

      - name: Smoke test (pacman)
        env:
          STDLIB_PATH: ${{ github.workspace }}/stdlib
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash stdlib/scripts/pm-smoke-test.sh \
            test-pacman test-mise test-npm test-python test-gem test-cargo test-go test-luarocks test-github

  integration-alpine:
    name: Integration / Alpine (apk)
    runs-on: ubuntu-latest
    needs: build-linux
    container: alpine:latest
    env:
      HOME: /root
    steps:
      - name: Install git
        run: apk add --no-cache git bash sudo

      - name: Checkout meowctl-stdlib
        uses: actions/checkout@v6
        with:
          path: stdlib

      - uses: actions/download-artifact@v8
        with:
          name: meowctl-linux
          path: bin

      - name: Install meowctl
        run: |
          mkdir -p "$HOME/.local/bin"
          install -m755 bin/meowctl "$HOME/.local/bin/meowctl"
          echo "MEOWCTL_BIN=$HOME/.local/bin/meowctl" >> "$GITHUB_ENV"

      - name: Smoke test (apk)
        env:
          STDLIB_PATH: ${{ github.workspace }}/stdlib
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash stdlib/scripts/pm-smoke-test.sh \
            test-apk test-mise test-npm test-python test-gem test-cargo test-go test-luarocks test-github

  integration-macos:
    name: Integration / macOS (brew)
    runs-on: macos-latest
    steps:
      - name: Checkout meowctl-stdlib
        uses: actions/checkout@v6
        with:
          path: stdlib

      - name: Checkout meowctl
        uses: actions/checkout@v6
        with:
          repository: meowshed/meowctl
          path: meowctl

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: meowctl

      - name: Build and install meowctl
        working-directory: meowctl
        run: |
          cargo build --release --locked
          mkdir -p "$HOME/.local/bin"
          install -m755 target/release/meowctl "$HOME/.local/bin/meowctl"
          echo "MEOWCTL_BIN=$HOME/.local/bin/meowctl" >> "$GITHUB_ENV"

      - name: Smoke test (brew)
        env:
          STDLIB_PATH: ${{ github.workspace }}/stdlib
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash stdlib/scripts/pm-smoke-test.sh \
            test-brew test-mise test-npm test-python test-gem test-cargo test-go test-luarocks test-github test-mas

  secrets:
    name: Secrets (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@7dc056a193116ba8d82154bf0549381c8fb8545c # v3.88.14
        with:
          extra_args: --results=verified,unknown
